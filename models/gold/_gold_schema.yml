version: 2

# ============================================================================
# GOLD LAYER - BUSINESS-READY MODELS
# ============================================================================
# Tests and documentation for dimensions, facts, and reports
# ============================================================================

models:
  - name: dim_customers
    description: Customer dimension with aggregated metrics and segmentation
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: first_name
        tests: [not_null]
      - name: last_name
        tests: [not_null]
      - name: email
        tests: [unique, not_null]
      - name: phone
      - name: address
      - name: city
      - name: state
      - name: zip_code
      - name: created_at
        tests: [not_null]
      - name: customer_segment
        description: Based on purchase frequency
        tests:
          - accepted_values:
              values:
                [
                  'never_purchased',
                  'one_time',
                  'occasional',
                  'regular',
                  'champion',
                ]
      - name: value_tier
        description: Based on lifetime revenue
        tests:
          - accepted_values:
              values:
                ['no_value', 'low_value', 'medium_value', 'high_value', 'vip']
      - name: activity_status
        description: Based on recency of orders
        tests:
          - accepted_values:
              values: ['never_ordered', 'active', 'at_risk', 'churned']

  - name: dim_products
    description: Product dimension with categorization
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: product_name
        tests: [not_null]
      - name: category
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: stock_quantity
        tests: [not_null]
      - name: description
      - name: price_category
        tests:
          - accepted_values:
              values: ['budget', 'mid_range', 'premium']
      - name: sales_performance
        tests:
          - accepted_values:
              values: ['no_sales', 'low_seller', 'medium_seller', 'high_seller']
      - name: product_status
        tests:
          - accepted_values:
              values: ['inactive', 'no_orders', 'stale', 'slow_moving', 'active']
      - name: margin_category
        tests:
          - accepted_values:
              values: ['low_margin', 'medium_margin', 'high_margin']

  - name: dim_orders
    description: Orders dimension with denormalized customer and product information
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: quantity
        tests: [not_null]
      - name: order_date
        tests: [not_null]
      - name: total_amount
        tests: [not_null]
      - name: order_status
        tests: [not_null]
      - name: first_name
      - name: last_name
      - name: email
      - name: city
      - name: state
      - name: product_name
      - name: category
      - name: product_price
      - name: order_status_category
        tests:
          - accepted_values:
              values: ['completed', 'pending', 'processing', 'other']
      - name: order_year
      - name: order_month
      - name: order_quarter
      - name: order_week
    
  - name: rpt_monthly_sales
    description: Monthly sales performance report with revenue and order metrics
    columns:
      - name: order_year_month
        tests: [unique, not_null]
        description: Year-month identifier (YYYY-MM format)
      - name: order_year
        tests: [not_null]
        description: Year extracted from order date
      - name: order_month
        tests: [not_null]
        description: Month number extracted from order date
      - name: total_orders
        tests: [not_null]
        description: Total number of orders in the month
      - name: completed_orders
        tests: [not_null]
        description: Number of completed orders in the month
      - name: total_revenue
        tests: [not_null]
        description: Total revenue for the month
      - name: avg_order_value
        tests: [not_null]
        description: Average order value for the month

  - name: rpt_product_performance
    description: Product sales and profit analysis report
    columns:
      - name: product_id
        tests: [unique, not_null]
        description: Unique product identifier
      - name: product_name
        tests: [not_null]
        description: Name of the product
      - name: category
        tests: [not_null]
        description: Product category
      - name: price
        tests: [not_null]
        description: Current product price
      - name: price_category
        tests:
          - accepted_values:
              values: ['budget', 'mid_range', 'premium']
        description: Price tier categorization
      - name: orders_containing_product
        tests: [not_null]
        description: Number of completed orders containing this product
      - name: total_units_sold
        tests: [not_null]
        description: Total quantity units sold
      - name: total_revenue
        tests: [not_null]
        description: Total revenue generated by this product
      - name: avg_order_value
        tests: [not_null]
        description: Average value when product is ordered
      - name: performance_tier
        tests:
          - accepted_values:
              values:
                [
                  'top_performer',
                  'strong_performer',
                  'moderate_performer',
                  'low_performer',
                ]
        description: Performance classification based on revenue
      - name: margin_category
        tests:
          - accepted_values:
              values: ['high_margin', 'medium_margin', 'low_margin']
        description: Profitability categorization
      - name: product_status
        tests:
          - accepted_values:
              values: ['inactive', 'no_orders', 'stale', 'slow_moving', 'active']
        description: Product health status
      - name: stock_quantity
        tests: [not_null]
        description: Current stock quantity available
