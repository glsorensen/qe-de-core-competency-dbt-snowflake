version: 2

# ============================================================================
# SILVER LAYER - STAGING MODELS
# ============================================================================
# Tests and documentation for cleaned/standardized staging models
# ============================================================================

models:
  - name: stg_customers
    description: Cleaned and standardized customer data
    columns:
      - name: customer_id
        tests: [unique, not_null]
        description: Unique customer identifier
      - name: first_name
        tests: [not_null]
        description: Customer first name
      - name: last_name
        tests: [not_null]
        description: Customer last name
      - name: email
        tests: [unique, not_null]
        description: Customer email address
      - name: phone
        description: Customer phone number
      - name: address
        description: Customer street address
      - name: city
        description: Customer city
      - name: state
        description: Customer state
      - name: zip_code
        description: Customer zip code
      - name: created_at
        tests: [not_null]
        description: Account creation date

  - name: stg_products
    description: Cleaned product catalog
    columns:
      - name: product_id
        tests: [unique, not_null]
        description: Unique product identifier
      - name: product_name
        tests: [not_null]
        description: Product name (standardized)
      - name: category
        tests: [not_null]
        description: Product category (standardized)
      - name: price
        tests: [not_null]
        description: Product price
      - name: stock_quantity
        tests: [not_null]
        description: Current stock quantity
      - name: description
        description: Product description

  - name: stg_orders
    description: Cleaned order data with order details
    columns:
      - name: order_id
        tests: [unique, not_null]
        description: Unique order identifier
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
        description: Customer who placed the order
      - name: product_id
        tests: [not_null]
        description: Product in the order
      - name: quantity
        tests: [not_null]
        description: Quantity ordered
      - name: order_date
        tests: [not_null]
        description: Order date
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['completed', 'pending', 'processing']
        description: Order status
      - name: total_amount
        tests: [not_null]
        description: Total order amount
      - name: order_year
        description: Year extracted from order date
      - name: order_month
        description: Month extracted from order date
      - name: order_quarter
        description: Quarter extracted from order date
      - name: order_year_month
        description: Year-month identifier
      - name: order_day_of_week
        description: Day of week of order

