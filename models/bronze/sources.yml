version: 2

# ============================================================================
# BRONZE LAYER - RAW DATA SOURCES
# ============================================================================
# This file defines where your raw data lives in Snowflake.
# In dbt, you reference these using: {{ source('raw', 'table_name') }}
#
# Raw tables can be loaded with `dbt seed` or from an external Snowflake stage.
# This file defines the source contract either way.
# ============================================================================

sources:
  - name: raw
    description: Raw e-commerce data (Bronze Layer)
    schema: raw

    tables:
      # Customer master data
      - name: customers
        description: Customer information from the CRM system
        columns:
          - name: customer_id
            description: Unique customer identifier
            tests:
              - unique
              - not_null
          - name: first_name
            description: Customer first name
            tests:
              - not_null
          - name: last_name
            description: Customer last name
            tests:
              - not_null
          - name: email
            description: Customer email address
            tests:
              - unique
              - not_null
          - name: phone
            description: Customer phone number
          - name: address
            description: Customer street address
          - name: city
            description: Customer city
          - name: state
            description: Customer state
          - name: zip_code
            description: Customer zip code
          - name: created_at
            description: Account creation date
            tests:
              - not_null

      # Order transactions
      - name: orders
        description: Order header data from e-commerce platform
        columns:
          - name: order_id
            description: Unique order identifier
            tests:
              - unique
              - not_null
          - name: customer_id
            description: Foreign key to customers
            tests:
              - not_null
          - name: product_id
            description: Foreign key to products
            tests:
              - not_null
          - name: quantity
            description: Quantity ordered
            tests:
              - not_null
          - name: order_date
            description: Date order was placed
            tests:
              - not_null
          - name: total_amount
            description: Total order amount
            tests:
              - not_null
          - name: status
            description: Order status
            tests:
              - not_null
              - accepted_values:
                  values: ['completed', 'pending', 'processing']

      # Product catalog
      - name: products
        description: Product catalog data
        columns:
          - name: product_id
            description: Unique product identifier
            tests:
              - unique
              - not_null
          - name: product_name
            description: Product name
            tests:
              - not_null
          - name: category
            description: Product category
            tests:
              - not_null
          - name: price
            description: Product price
            tests:
              - not_null
          - name: stock_quantity
            description: Current stock quantity
            tests:
              - not_null
          - name: description
            description: Product description

